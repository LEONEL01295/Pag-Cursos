<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CourseHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .strength-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.3rem;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.3s;
        }

        .terms {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .terms input {
            width: auto;
            margin-right: 0.5rem;
        }

        .terms label {
            margin: 0;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .login-link {
            text-align: center;
            margin-top: 1rem;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
        }

        .error {
            color: #f44336;
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .success {
            background: #4caf50;
            color: white;
            padding: 1rem;
            border-radius: 5px;
            text-align: center;
            display: none;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Crear Cuenta</h1>
        
        <div class="success" id="successMessage">
            ¡Registro exitoso! Bienvenido a CourseHub
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Nombre Completo</label>
                <input type="text" id="fullname" required placeholder="Juan Pérez">
                <div class="error" id="fullnameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono (Opcional)</label>
                <input type="tel" id="phone" placeholder="+52 1234567890">
            </div>

            <div class="form-group">
                <label for="country">País</label>
                <select id="country" required>
                    <option value="">Selecciona tu país</option>
                    <option value="mexico">México</option>
                    <option value="colombia">Colombia</option>
                    <option value="argentina">Argentina</option>
                    <option value="españa">España</option>
                    <option value="other">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Mínimo 8 caracteres">
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span id="strengthText">Contraseña débil</span>
                </div>
                <div class="error" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" required placeholder="Repite tu contraseña">
                <div class="error" id="confirmError"></div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">Acepto los términos y condiciones</label>
            </div>

            <button type="submit" class="btn">Crear Cuenta</button>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="#">Inicia sesión aquí</a>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const passwordInput = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const successMessage = document.getElementById('successMessage');

        // Validar fortaleza de contraseña
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strength = calculateStrength(password);
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            fill.style.width = strength.percentage + '%';
            fill.style.background = strength.color;
            text.textContent = strength.text;
        });

        function calculateStrength(password) {
            let strength = 0;
            const regex = {
                lower: /[a-z]/,
                upper: /[A-Z]/,
                number: /[0-9]/,
                special: /[^A-Za-z0-9]/
            };

            if (password.length >= 8) strength += 25;
            if (regex.lower.test(password)) strength += 25;
            if (regex.upper.test(password)) strength += 25;
            if (regex.number.test(password)) strength += 25;

            if (strength >= 75) {
                return { percentage: 100, color: '#4caf50', text: 'Contraseña fuerte' };
            } else if (strength >= 50) {
                return { percentage: 66, color: '#ff9800', text: 'Contraseña media' };
            }
            return { percentage: 33, color: '#f44336', text: 'Contraseña débil' };
        }

        // Validar formulario
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Limpiar errores previos
            document.querySelectorAll('.error').forEach(el => el.textContent = '');

            let isValid = true;

            // Validar email
            const email = document.getElementById('email').value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').textContent = 'Email inválido';
                isValid = false;
            }

            // Validar contraseña
            const password = passwordInput.value;
            if (password.length < 8) {
                document.getElementById('passwordError').textContent = 'Mínimo 8 caracteres';
                isValid = false;
            }

            // Validar coincidencia de contraseña
            if (password !== confirmPassword.value) {
                document.getElementById('confirmError').textContent = 'Las contraseñas no coinciden';
                isValid = false;
            }

            if (isValid) {
                // Simular envío de formulario
                form.style.display = 'none';
                successMessage.style.display = 'block';

                // Redirigir después de 2 segundos
                setTimeout(() => {
                    alert('Registro completado. Redirigiendo al dashboard...');
                }, 2000);
            }
        });
    </script>
</body>
</html>
