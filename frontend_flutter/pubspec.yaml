name: coursehub_free
description: Plataforma profesional de cursos gratis con Flutter

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  get: ^4.6.0
  
  # Networking
  dio: ^5.0.0
  http: ^1.1.0
  
  # Firebase
  firebase_core: ^2.0.0
  firebase_auth: ^4.0.0
  firebase_storage: ^11.0.0
  cloud_firestore: ^4.0.0
  
  # Media
  video_player: ^2.4.0
  image_picker: ^1.0.0
  
  # PDF
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^15.0.0
  
  # UI
  google_fonts: ^6.0.0
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
